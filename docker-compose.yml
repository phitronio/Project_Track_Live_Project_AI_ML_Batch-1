services:
  backend:
    build: .
    container_name: sales-agent-api
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    command: >
       uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg17
    container_name: sales-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - sales-agent-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: sales-agent-embedder
    restart: unless-stopped
    command: --model-id unsloth/embeddinggemma-300m
    ports:
      - "8090:80"
    volumes:
      - sales-agent-hf-cache:/data

volumes:
  sales-agent-db-data:
  sales-agent-hf-cache:
